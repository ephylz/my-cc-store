<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verified CC Vendor</title>
    <style>
        :root { --primary: #00ff88; --bg-dark: #0a0a0c; --card-bg: #141418; --text-main: #ffffff; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 0; }
        header { width: 100%; background: #000; padding: 15px 0; text-align: center; border-bottom: 1px solid #222; font-size: 24px; font-weight: 900; letter-spacing: 2px; }
        header span { color: var(--primary); }
        .container { max-width: 500px; width: 90%; margin: 20px auto; display: flex; flex-direction: column; gap: 20px; }
        .product-card { background: var(--card-bg); border: 1px solid #2a2a35; border-radius: 12px; padding: 25px; text-align: center; position: relative; overflow: hidden; }
        .badge { position: absolute; top: 12px; right: -30px; background: var(--primary); color: #000; padding: 5px 35px; font-size: 11px; font-weight: bold; transform: rotate(45deg); }
        .balance { font-size: 28px; font-weight: 800; margin: 10px 0; }
        .price { font-size: 24px; color: var(--primary); font-weight: bold; margin: 15px 0; }
        button { background: var(--primary); color: #000; border: none; padding: 14px; width: 100%; font-size: 16px; font-weight: 900; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        
        /* Payment Modal */
        #checkout-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 999; align-items: center; justify-content: center; }
        .payment-box { background: var(--card-bg); border: 1px solid #333; border-radius: 12px; padding: 25px; width: 90%; max-width: 350px; text-align: center; }
        .qr-code { width: 200px; height: 200px; display: block; margin: 15px auto; border-radius: 10px; }
        .upi-btn { display: block; background: #fff; color: #000; text-decoration: none; padding: 14px; border-radius: 8px; font-weight: bold; margin-top: 15px; }
        .loader { border: 4px solid #333; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>DARK<span>STORE</span></header>

    <div class="container">
        
        <!-- ITEM 1 -->
        <div class="product-card">
            <h3 style="margin:0; color:#888;">Starter CC</h3>
            <div class="balance">$200.00 Balance</div>
            <div class="price">₹50</div>
            <button onclick="initiateCheckout('₹50', '50.00')">Buy Starter</button>
        </div>

        <!-- ITEM 2 -->
        <div class="product-card">
            <div class="badge">BEST SELLER</div>
            <h3 style="margin:0; color:#888;">Premium CC</h3>
            <div class="balance">$1,000.00 Balance</div>
            <div class="price">₹100</div>
            <button onclick="initiateCheckout('₹100', '100.00')">Buy Premium</button>
        </div>

        <!-- ITEM 3 -->
        <div class="product-card">
            <h3 style="margin:0; color:#888;">Elite CC</h3>
            <div class="balance">$5,000.00 Balance</div>
            <div class="price">₹300</div>
            <button onclick="initiateCheckout('₹300', '300.00')">Buy Elite</button>
        </div>

    </div>

    <!-- Checkout Modal -->
    <div id="checkout-overlay">
        <div class="payment-box">
            <div id="loading-state">
                <h3 style="color: var(--primary);">Securing Connection...</h3>
                <div class="loader"></div>
            </div>

            <div id="qr-state" style="display: none;">
                <h3>Awaiting Payment</h3>
                <p style="font-size: 14px; color: #888;">Scan to pay <b id="display-price" style="color: #fff;"></b></p>
                
                <!-- QR CODE IMAGE SETTING -->
                <img id="qr-image" src="my-qr.jpg" class="qr-code" alt="QR Code">
                
                <a id="dynamic-upi" href="#" class="upi-btn">Pay via UPI App</a>
                <button onclick="closeCheckout()" style="background: #333; color: #fff; margin-top: 15px;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. APNA ASLI UPI ID YAHAN LIKHO:
        const MY_UPI_ID = "ephylz@ptsbi"; 
        
        // 2. APNE QR IMAGE KA EXACT NAAM YAHAN LIKHO:
        // Agar iPhone ne isko .png me save kiya hai to "my-qr.png" likho
        const MY_QR_FILENAME = "my-qr.jpg"; 
        // ==========================================

        document.getElementById('qr-image').src = MY_QR_FILENAME;

        function initiateCheckout(displayPrice, upiAmount) {
            document.getElementById('checkout-overlay').style.display = 'flex';
            document.getElementById('loading-state').style.display = 'block';
            document.getElementById('qr-state').style.display = 'none';

            document.getElementById('display-price').innerText = displayPrice;
            
            const upiLink = `upi://pay?pa=${MY_UPI_ID}&pn=DarkStore&am=${upiAmount}&cu=INR`;
            document.getElementById('dynamic-upi').href = upiLink;

            setTimeout(() => {
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('qr-state').style.display = 'block';
            }, 2000);
        }

        function closeCheckout() {
            document.getElementById('checkout-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
